version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - rm -rf .next/cache
        - rm -rf .next/standalone
        - rm -rf node_modules/@prisma/engines/*windows*
        - rm -rf node_modules/@prisma/engines/*darwin*
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
