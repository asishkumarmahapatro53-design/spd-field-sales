version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - rm -f .env.production
        - |
          node <<'EOF'
          const fs = require("fs");

          const keys = [
            "ALLOW_EPHEMERAL_PERSISTENCE",
            "APP_ORIGIN",
            "DISABLE_LOGIN",
            "FIREBASE_APP_STATE_COLLECTION",
            "FIREBASE_APP_STATE_DOC",
            "FIREBASE_CLIENT_EMAIL",
            "FIREBASE_FIRESTORE_DATABASE_ID",
            "FIREBASE_PRIVATE_KEY",
            "FIREBASE_PROJECT_ID",
            "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64",
            "FIREBASE_STORAGE_BUCKET",
            "FIREBASE_USE_STORAGE",
            "GEMINI_API_KEY",
            "GEMINI_CHAT_MODEL",
            "GEMINI_OCR_MODEL",
            "GMAIL_APP_PASSWORD",
            "GMAIL_SMTP_USER",
            "ODOO_API_KEY",
            "ODOO_DB",
            "ODOO_TIMEOUT_MS",
            "ODOO_URL",
            "ODOO_USERNAME",
            "PREFLIGHT_ALLOW_EMPTY_FIREBASE",
            "PREFLIGHT_SKIP_GEMINI",
            "S3_ACCESS_KEY_ID",
            "S3_BUCKET_NAME",
            "S3_REGION",
            "S3_SECRET_ACCESS_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_STORAGE_BUCKET",
            "SUPABASE_URL",
            "SUPABASE_USE_STORAGE",
            "SYSTEM_HEALTH_TOKEN",
          ];

          for (const [key] of Object.entries(process.env)) {
            if (key.startsWith("EMPLOYEE_EMAIL_")) {
              keys.push(key);
            }
          }

          const lines = keys.flatMap((key) => {
            const value = process.env[key];
            return value ? [`${key}=${JSON.stringify(value)}`] : [];
          });

          fs.writeFileSync(".env.production", lines.length ? `${lines.join("\n")}\n` : "");
          EOF
        - npm run preflight:production
        - npm run build
    postBuild:
      commands:
        - rm -rf .next/cache
        - rm -rf .next/standalone
        - rm -rf node_modules/@prisma/engines/*windows*
        - rm -rf node_modules/@prisma/engines/*darwin*
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
